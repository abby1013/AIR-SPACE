<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AIR SPACE 倉儲物流工作回報系統</title>
<style>
:root{
 --ink:#14161a;--ink2:#454c56;--ink3:#7a828d;--line:#e4e7eb;--soft:#f5f6f8;
 --brand:#0f2f4f;--brand2:#1b4a78;--accent:#c8102e;
 --ok:#0f7b4f;--okbg:#e8f5ee;--warn:#9a6100;--warnbg:#fff5e0;
 --bad:#b3261e;--badbg:#fdeceb;--info:#1a4f8a;--infobg:#eaf1fa;
 --lock:#aab1ba;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--soft);color:var(--ink);
 font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
 font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit}
.hide{display:none!important}

/* ── shell ── */
.app{max-width:520px;margin:0 auto;min-height:100vh;background:#fff;
 box-shadow:0 0 40px rgba(0,0,0,.06);display:flex;flex-direction:column}
.app.wide{max-width:1280px}
.bar{background:var(--brand);color:#fff;padding:13px 16px;display:flex;align-items:center;
 gap:11px;position:sticky;top:0;z-index:50}
.bar .back{font-size:22px;line-height:1;padding:2px 6px;margin-left:-6px;opacity:.9}
.bar .ttl{font-weight:700;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .sub{font-size:11.5px;opacity:.72;font-weight:400}
.bar .act{font-size:12.5px;background:rgba(255,255,255,.15);padding:5px 11px;border-radius:100px}
.sync{font-size:10.5px;padding:3px 9px;border-radius:100px;white-space:nowrap;font-weight:700}
.sync.ok{background:rgba(74,222,128,.22);color:#bbf7d0}
.sync.idle{background:rgba(255,255,255,.14);color:rgba(255,255,255,.8)}
.sync.local{background:rgba(255,212,121,.2);color:#ffe9b8}
.sync.wait{background:rgba(255,212,121,.28);color:#ffe9b8}
.sync.err{background:rgba(255,138,128,.28);color:#ffd5d1}
.body{flex:1;padding:16px}

/* ── home ── */
.hero{background:linear-gradient(160deg,var(--brand),var(--brand2));color:#fff;
 padding:34px 22px 30px;text-align:center}
.hero .lg{font-size:11px;letter-spacing:.3em;opacity:.7;margin-bottom:10px}
.hero h1{font-size:21px;margin:0 0 6px;font-weight:700}
.hero p{font-size:12.5px;opacity:.8;margin:0}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:6px}
.pick button{background:#fff;border:2px solid var(--line);border-radius:14px;padding:20px 12px;
 font-size:17px;font-weight:700;color:var(--brand);transition:.12s;text-align:center}
.pick button:active{transform:scale(.97);border-color:var(--brand)}
.pick button small{display:block;font-size:11.5px;font-weight:400;color:var(--ink3);margin-top:4px}
.pick button[disabled]{opacity:.42}

.rlist button{display:block;width:100%;background:#fff;border:2px solid var(--line);
 border-radius:14px;padding:16px 18px;margin-bottom:11px;text-align:left;transition:.12s}
.rlist button:active{transform:scale(.985);border-color:var(--brand)}
.rlist .nm{font-size:17px;font-weight:700;color:var(--brand)}
.rlist .mt{font-size:12.5px;color:var(--ink3);margin-top:3px}
.rlist .rt{font-size:12px;color:var(--ink2);margin-top:6px;line-height:1.5}
.rlist .bd{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;
 background:var(--warnbg);color:var(--warn);margin-top:7px}

/* ── progress ── */
.prog{background:var(--brand);color:#fff;padding:14px 16px 16px}
.prog .row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:9px}
.prog .big{font-size:31px;font-weight:800;line-height:1}
.prog .lb{font-size:11.5px;opacity:.78}
.prog .tr{height:7px;background:rgba(255,255,255,.22);border-radius:100px;overflow:hidden}
.prog .tf{height:100%;background:#4ade80;border-radius:100px;transition:width .35s}
.prog .st{display:flex;gap:14px;margin-top:9px;font-size:11.5px;opacity:.82}

/* ── stop cards ── */
.stop{border:2px solid var(--line);border-radius:13px;margin-bottom:11px;overflow:hidden;background:#fff}
.stop.locked{opacity:.55;background:var(--soft)}
.stop.active{border-color:var(--brand);box-shadow:0 3px 14px rgba(15,47,79,.12)}
.stop.done{border-color:var(--ok)}
.stop .hd{padding:13px 15px;display:flex;gap:12px;align-items:flex-start}
.stop .sq{flex:0 0 30px;height:30px;border-radius:9px;background:var(--soft);color:var(--ink3);
 display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.stop.active .sq{background:var(--brand);color:#fff}
.stop.done .sq{background:var(--ok);color:#fff}
.stop .in{flex:1;min-width:0}
.stop .nm{font-weight:700;font-size:15px;line-height:1.35}
.stop .tm{font-size:12.5px;color:var(--ink2);margin-top:2px;font-variant-numeric:tabular-nums}
.stop .tags{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px}
.stop .ft{padding:0 15px 13px}
.btn{display:block;width:100%;padding:13px;border-radius:10px;font-weight:700;font-size:15px;text-align:center}
.btn-go{background:var(--brand);color:#fff}
.btn-out{background:var(--accent);color:#fff}
.btn-gh{background:var(--soft);color:var(--ink3);border:1px solid var(--line)}
.btn-ok{background:var(--okbg);color:var(--ok);border:1px solid #b9e0cb}
.btn:active{opacity:.85}
.btn[disabled]{background:#e9ecef;color:var(--lock);cursor:not-allowed}

.tag{display:inline-block;padding:1.5px 7px;border-radius:5px;font-size:10.5px;font-weight:700;line-height:1.7}
.t-ok{background:var(--okbg);color:var(--ok)}
.t-warn{background:var(--warnbg);color:var(--warn)}
.t-bad{background:var(--badbg);color:var(--bad)}
.t-info{background:var(--infobg);color:var(--info)}
.t-mute{background:#edeff2;color:var(--ink3)}
.t-v1{background:#e6eefc;color:#1a4f8a}
.t-v2{background:#fde8f0;color:#a01a55}

/* ── task list ── */
.tk{border:1.5px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:9px;background:#fff}
.tk.done{background:var(--okbg);border-color:#b9e0cb}
.tk.miss{background:var(--badbg);border-color:#f0c4c1}
.tk.na{background:var(--soft);border-color:var(--line);opacity:.8}
.tk.off{background:var(--soft);border-color:var(--line);opacity:.55}
.tk.off .cb{border-color:var(--line);background:transparent;color:var(--ink3)}
.tk.off .nm{font-weight:400;color:var(--ink3)}
.tk .tr{display:flex;align-items:center;gap:11px}
.tk .cb{flex:0 0 24px;height:24px;border:2px solid var(--ink3);border-radius:7px;
 display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff}
.tk.done .cb{background:var(--ok);border-color:var(--ok)}
.tk.miss .cb{background:var(--bad);border-color:var(--bad)}
.tk.na .cb{background:var(--ink3);border-color:var(--ink3)}
.tk .nm{flex:1;font-weight:600;font-size:14.5px}
.tk .mini{font-size:11px;padding:4px 9px;border-radius:6px;background:var(--soft);
 border:1px solid var(--line);color:var(--ink2);font-weight:600}
.tk .rs{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.tk select,.tk textarea{width:100%;padding:9px 10px;border:1.5px solid var(--line);
 border-radius:8px;margin-top:6px;background:#fff}
.tk textarea{resize:vertical;min-height:48px}

.secttl{font-size:12px;letter-spacing:.1em;color:var(--ink3);font-weight:700;margin:20px 0 9px}
.note{background:var(--infobg);border-left:3px solid var(--info);border-radius:8px;
 padding:11px 14px;font-size:12.5px;color:var(--ink2);margin-bottom:14px}
.warnbox{background:var(--warnbg);border-left:3px solid var(--warn);border-radius:8px;
 padding:11px 14px;font-size:12.5px;color:var(--ink2);margin:12px 0}

/* ── modal ── */
.mask{position:fixed;inset:0;background:rgba(10,15,22,.55);z-index:200;
 display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:520px;
 max-height:88vh;overflow-y:auto;padding:20px 18px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 4px;font-size:17px}
.sheet .sd{font-size:12.5px;color:var(--ink3);margin-bottom:14px}

/* ── admin ── */
.tabs{display:flex;background:#fff;border-bottom:2px solid var(--line);position:sticky;top:49px;z-index:40}
.tabs button{flex:1;padding:12px 6px;font-size:13.5px;font-weight:700;color:var(--ink3);
 border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--brand);border-bottom-color:var(--accent)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px;margin-bottom:16px}
.kpi .c{background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:13px 15px}
.kpi .k{font-size:10.5px;letter-spacing:.11em;color:var(--ink3);font-weight:700}
.kpi .v{font-size:25px;font-weight:800;color:var(--brand);line-height:1.25;margin-top:3px}
.kpi .d{font-size:11.5px;color:var(--ink3)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:var(--brand);color:#fff;text-align:left;padding:8px 9px;font-size:11.5px;white-space:nowrap}
td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:nth-child(even){background:#fafbfc}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.mini{font-size:11px;padding:4px 9px;border-radius:6px;background:var(--soft);
 border:1px solid var(--line);color:var(--ink2);font-weight:600;cursor:pointer}
.mini-tr{height:6px;background:var(--line);border-radius:100px;overflow:hidden;min-width:70px}
.mini-tf{height:100%;background:var(--ok);border-radius:100px}
.gantt{position:relative;height:22px;background:var(--soft);border-radius:5px;min-width:220px}
.gantt i{position:absolute;top:0;height:100%;border-radius:4px;display:block}
.gantt i.p{background:#cfd6de}
.gantt i.a{background:var(--brand);opacity:.9;height:60%;top:20%}

.foot{padding:16px;text-align:center;font-size:11.5px;color:var(--ink3);border-top:1px solid var(--line)}
.linkbtn{color:var(--brand);text-decoration:underline;font-size:12.5px}
@media(max-width:560px){.app.wide{max-width:100%}}
</style>
</head>

    if(!this.d) this.d = {days:{}, ident:null, ver:1};
    try{ this.queue = JSON.parse(localStorage.getItem(QKEY)) || []; }catch(e){ this.queue=[]; }
    return this.d;
  },
  save(){ try{ localStorage.setItem(KEY, JSON.stringify(this.d)); }catch(e){} },
  saveQ(){ try{ localStorage.setItem(QKEY, JSON.stringify(this.queue)); }catch(e){} },

  device(){
    let id=null;
    try{ id=localStorage.getItem(DKEY); }catch(e){}
    if(!id){ id='D'+Math.random().toString(36).slice(2,10);
      try{ localStorage.setItem(DKEY,id); }catch(e){} }
    return id;
  },

  /** 排入雲端寫入佇列，立即嘗試送出；失敗留在佇列，下次自動重送 */
  post(payload){
    if(this.mode!=='sheets') return;
    payload.device = this.device();
    payload._t = Date.now();
    this.queue.push(payload); this.saveQ();
    this.flush();
  },

  async flush(){
    if(this.mode!=='sheets' || this.sending || !this.queue.length) return;
    this.sending = true;
    try{
      while(this.queue.length){
        const item = this.queue[0];
        // 不設 Content-Type，讓瀏覽器送 text/plain，避開 Apps Script 的 CORS preflight
        const r = await fetch(CFG.apiUrl, { method:'POST', body: JSON.stringify(item) });
        const j = await r.json();
        if(!j || j.ok===false) throw new Error((j&&j.error)||'伺服器回傳失敗');
        this.queue.shift(); this.saveQ();
        this.lastOk = new Date(); this.lastErr = null;
      }
    }catch(e){
      this.lastErr = String(e && e.message ? e.message : e);
    }finally{
      this.sending = false;
      syncBadge();
    }
  },

  reset(){
    this.d={days:{},ident:null,ver:1}; this.queue=[];
    this.save(); this.saveQ();
  }
};

/* 同步狀態指示（司機端右上角小字）*/
function syncStatus(){
  if(DB.mode!=='sheets') return {k:'local', t:'本機模式'};
  if(DB.queue.length) return {k:'wait', t:'待同步 '+DB.queue.length+' 筆'};
  if(DB.lastErr)      return {k:'err',  t:'同步失敗'};
  if(DB.lastOk)       return {k:'ok',   t:'已同步'};
  return {k:'idle', t:'雲端模式'};
}
function syncBadge(){
  const el = document.getElementById('syncBadge');
  if(!el) return;
  const s = syncStatus();
  el.className = 'sync '+s.k;
  el.textContent = s.t;
}
/* 每 20 秒自動重送未成功的資料（訊號恢復後自動補上）*/
setInterval(()=>{ if(DB.queue.length) DB.flush(); }, 20000);
window.addEventListener('online', ()=>DB.flush());

/* ── 工具 ─────────────────────────────────────────────── */
const TASKMAP = {}; M.tasks.forEach(t=>TASKMAP[t[0]]={code:t[0],name:t[1],kind:t[2],onlyType:t[3]||''});
const STORE = {}; M.stores.forEach(s=>STORE[s.id]=s);
const DRV = {}; M.drivers.forEach(d=>DRV[d[0]]={id:d[0],name:d[1],emp:d[2],region:d[3],route:d[4],on:d[5],off:d[6],ab:d[7],status:d[8]});
const RTE = {}; M.routes.forEach(r=>RTE[r[0]]={id:r[0],region:r[1],name:r[2],driver:r[3],days:r[4],status:r[5],desc:r[6]});
const REASON = M.reasons.map(r=>({code:r[0],name:r[1],cat:r[2],needTxt:!!r[3],needAudit:!!r[4]}));

const pad=n=>String(n).padStart(2,'0');
const toMin=t=>{const[a,b]=t.split(':');return +a*60+ +b;};
const toHM=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const todayStr=(dt)=>{const d=dt||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());};
const nowISO=()=>new Date().toISOString();
const dowOf=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).getDay();};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ── 隨到隨生成：核心 ────────────────────────────────────
   司機點名字的當下才呼叫。查不到就即時生成，不依賴任何定時任務。 */
function ensureDay(driverId, dateStr){
  const db=DB.load(), k=dateStr+'|'+driverId;
  if(db.days[k]) return db.days[k];

  const drv=DRV[driverId]; if(!drv) return null;
  const dow=dowOf(dateStr);
  if(dow===0||dow===6) { db.days[k]={date:dateStr,driver:driverId,route:null,weekend:true,stops:[]}; DB.save(); return db.days[k]; }
  const dk=String(dow);

  // 找當日生效路線（同一司機可有多條，依適用星期）
  const rt = M.routes.filter(r=>r[3]===driverId && r[4].includes(dk)).map(r=>RTE[r[0]])[0];
  if(!rt){ db.days[k]={date:dateStr,driver:driverId,route:null,noRoute:true,stops:[]}; DB.save(); return db.days[k]; }

  const abKey = drv.ab, ab = M.ab[abKey];
  const allTasks = ab ? Object.keys(ab.m) : [];                        // 固定清單
  const dayTasks = ab ? allTasks.filter(c=>ab.m[c].includes(dk)) : []; // 當日有勾的

  const stops = M.stations
    .filter(s=>s.route===rt.id && s.days.includes(dk))
    .sort((a,b)=>toMin(a.arrive)-toMin(b.arrive) || a.seq-b.seq)
    .map(s=>{
      let codes=[];
      // 作業型：固定顯示全部工作項目（邏輯統一）；當日未勾者標 sched=false
      if(s.mode==='WORK')      codes = allTasks.concat(s.extra||[]);
      else if(s.mode==='HANDOVER') codes = (s.extra&&s.extra.length)? s.extra : ['F1','F2'];
      else if(s.mode==='SHIP')     codes = ['F3','F4'];
      else if(s.mode==='WAREHOUSE')codes = ['F5'];
      else if(s.mode==='FIXED')    codes = s.extra||[];
      if(s.cont) codes = [];          // 休息前後同店續作，項目不重複計算
      // 門市型態限定：例如濾網清潔只在街邊店出現，百貨店完全不顯示
      codes = codes.filter(c=>{
        const ot=(TASKMAP[c]||{}).onlyType;
        if(!ot) return true;
        return (s.stores||[]).some(id=>(STORE[id]||{}).type===ot);
      });
      if(s.share) codes = [];         // 用餐後續作，與來源站共用同一組項目
      codes=[...new Set(codes)];
      return {
        id: rt.id+'_'+dk+'_'+s.seq,
        shareFrom: s.share ? (rt.id+'_'+dk+'_'+s.share) : null,
        seq:s.seq, type:s.type, mode:s.mode, visit:s.visit,
        label:s.label, stores:s.stores, note:s.note,
        arrive:s.arrive, leave:s.leave,
        inAt:null, outAt:null, inGeo:null, outGeo:null,
        tasks: codes.map(c=>({
          code:c, name:(TASKMAP[c]||{}).name||c,
          sched: ((TASKMAP[c]||{}).kind==='FIX') ? true : dayTasks.indexOf(c)>=0,
          st:null, at:null, reason:null }))
      };
    });

  db.days[k]={date:dateStr, driver:driverId, route:rt.id, routeName:rt.name, stops,
              building: stops.length===0, closed:false, closedAt:null};
  DB.save();
  return db.days[k];
}

/* ── 續作站：工作項目與來源站共用同一份 ─────────────────── */
function host(day, stop){
  if(stop && stop.shareFrom){
    const src=(day.stops||[]).filter(x=>x.id===stop.shareFrom)[0];
    if(src) return src;
  }
  return stop;
}

/* ── 完成度：只算工作項目（不適用不計入分母）───────────── */
function calc(day){
  let need=0, done=0, na=0, miss=0, unrep=0, off=0;
  let stopTot=0, stopIn=0, punct=0, punchTot=0, late=0;
  (day.stops||[]).forEach(s=>{
    if(s.type==='STORE'||s.type==='WAREHOUSE'||s.type==='SHIP'){
      stopTot++; if(s.inAt) stopIn++;
    }
    if(s.inAt){ punchTot++; const d=toMin(s.inAt)-toMin(s.arrive); if(Math.abs(d)<=CFG.toleranceMin) punct++; if(d>CFG.toleranceMin) late++; }
    if(s.outAt){ punchTot++; const d=toMin(s.outAt)-toMin(s.leave); if(Math.abs(d)<=CFG.toleranceMin) punct++; }
    (s.tasks||[]).forEach(t=>{
      if(t.sched===false){ off++; return; }   // 本日未排程：不計分子也不計分母
      need++;
      if(t.st==='done') done++;
      else if(t.st==='na') na++;
      else if(t.st==='miss') miss++;
      else if(s.outAt) unrep++;   // 已離店卻未回報
    });
  });
  const den = need - na;
  return {
    need, done, na, miss, unrep, den, off,
    pct: den>0 ? Math.round(done/den*1000)/10 : (need>0?0:100),
    naPct: need>0 ? Math.round(na/need*1000)/10 : 0,
    stopTot, stopIn, stopPct: stopTot>0?Math.round(stopIn/stopTot*1000)/10:0,
    punct, punchTot, punctPct: punchTot>0?Math.round(punct/punchTot*1000)/10:0,
    late
  };
}

/* ── 站點狀態機（四道鎖）──────────────────────────────── */
function stopState(day, i){
  const s=day.stops[i];
  if(s.outAt) return 'done';
  if(s.inAt)  return 'active';
  // 前面所有「同一時段之前」的站點是否都已離店
  const myA=toMin(s.arrive);
  const prior=day.stops.filter((x,j)=>j<i && toMin(x.arrive)<myA
              && x.type!=='TRAVEL' && x.type!=='REST');
  const blocked=prior.some(x=>!x.outAt);
  return blocked ? 'locked' : 'ready';
}
function judge(actual, plan){
  if(!actual) return null;
  const d=toMin(actual)-toMin(plan);
  if(Math.abs(d)<=CFG.toleranceMin) return {k:'ok',t:'準時',d};
  return d>0 ? {k:'late',t:(d>0?'晚 '+d+' 分':''),d} : {k:'early',t:'早 '+(-d)+' 分',d};
}

/* ── 靜默定位（不擋流程）──────────────────────────────── */
function grabGeo(cb){
  if(!CFG.captureGeo || !navigator.geolocation){ cb(null); return; }
  let done=false;
  const fin=v=>{ if(!done){done=true; cb(v);} };
  navigator.geolocation.getCurrentPosition(
    p=>fin({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy)}),
    ()=>fin(null), {enableHighAccuracy:true,timeout:4000,maximumAge:60000});
  setTimeout(()=>fin(null),4200);
}

/* ── 今日行程 ── */
function viewDay(){
  const drv=DRV[ST.driver];
  const day=ensureDay(ST.driver, ST.date);
  const c=calc(day);

  if(day.weekend) return shellDay(drv,day,c,`<div class="note">今天是週末，此路線僅適用週一至週五。</div>`);
  if(day.noRoute||day.building) return shellDay(drv,day,c,`<div class="warnbox"><b>此路線排程尚在建置中。</b><br>路線代碼已建立，補上站點資料後系統會自動生成每日任務，不需重建系統。<br><br>建置中期間不會計入完成度統計，也不會產生未到站紅燈。</div>`);

  const cards=day.stops.map((s,i)=>{
    const stt=stopState(day,i);
    const c2=calc({stops:[host(day,s)]});
    const ji=judge(s.inAt,s.arrive), jo=judge(s.outAt,s.leave);
    const isPassive = s.type==='TRAVEL'||s.type==='REST';
    return `<div class="stop ${stt}">
      <div class="hd">
        <div class="sq">${isPassive?(s.type==='REST'?'休':'車'):s.seq}</div>
        <div class="in">

            ${s.visit>1?`<span class="tag t-v2">第${s.visit}次·作業</span>`:(s.mode==='WORK'?'<span class="tag t-v2">作業</span>':'')}
            ${s.visit===1&&s.mode==='HANDOVER'?'<span class="tag t-v1">第1次·收送貨</span>':''}
            ${s.mode==='SHIP'?'<span class="tag t-info">寄貨</span>':''}
            ${s.mode==='WAREHOUSE'?'<span class="tag t-info">倉庫</span>':''}
            ${ji?`<span class="tag ${ji.k==='ok'?'t-ok':'t-warn'}">到 ${s.inAt}${ji.k!=='ok'?' · '+ji.t:''}</span>`:''}
            ${jo?`<span class="tag ${jo.k==='ok'?'t-ok':'t-warn'}">離 ${s.outAt}${jo.k!=='ok'?' · '+jo.t:''}</span>`:''}
            ${(s.outAt&&c2.miss)?`<span class="tag t-bad">未完成 ${c2.miss}</span>`:''}
            ${(s.outAt&&c2.unrep)?`<span class="tag t-bad">未回報 ${c2.unrep}</span>`:''}
          </div>
          ${s.note?`<div class="tm" style="color:var(--ink3);margin-top:5px">${esc(s.note)}</div>`:''}
        </div>
      </div>
      ${isPassive?'':`<div class="ft">
        ${stt==='ready'?`<button class="btn btn-go" onclick="clockIn(${i})">到店打卡</button>`:''}
        ${stt==='locked'?`<button class="btn" disabled>前一站尚未離店</button>`:''}
        ${stt==='active'?`<button class="btn btn-go" onclick="go('stop',{stop:${i}})">進行作業（${c2.done}/${c2.need}）</button>`:''}
        ${stt==='done'?`<button class="btn btn-ok" onclick="go('stop',{stop:${i}})">已離店 · 檢視（${c2.done}/${c2.den}）</button>`:''}
      </div>`}
    </div>`;
  }).join('');

  const allOut=day.stops.filter(s=>s.type!=='TRAVEL'&&s.type!=='REST').every(s=>s.outAt);
  const foot = day.closed
    ? `<div class="note"><b>今日已完成回報</b>　${day.closedAt}<br>完成度 ${c.pct}%　·　到站 ${c.stopIn}/${c.stopTot}　·　未完成 ${c.miss} 項</div>`
    : (allOut?`<button class="btn btn-out" onclick="closeDay()">下班回報</button>`:'');

  return shellDay(drv,day,c,cards+`<div style="margin-top:16px">${foot}</div>`);

/* ── 打卡 ── */
function clockIn(i){
  const day=ensureDay(ST.driver,ST.date), s=day.stops[i];
  const t=nowHM();
  grabGeo(g=>{
    s.inAt=t; s.inGeo=g; s.inISO=nowISO(); DB.save();
    DB.post({action:'punch', driver:ST.driver, stopId:s.id, act:'到店',
      planTime:s.arrive, storeId:(s.stores||[])[0]||'',
      lat:g?g.lat:'', lng:g?g.lng:''});
    go('stop',{stop:i});
  });
}
function clockOut(){
  const day=ensureDay(ST.driver,ST.date), s=day.stops[ST.stop];
  const un=host(day,s).tasks.filter(t=>t.sched!==false && !t.st);
  if(un.length){ ST.modal={type:'confirmOut',n:un.length}; return render(); }
  doOut();
}
function doOut(){
  const day=ensureDay(ST.driver,ST.date), s=day.stops[ST.stop];
  const t=nowHM();
  grabGeo(g=>{
    s.outAt=t; s.outGeo=g; s.outISO=nowISO(); ST.modal=null; DB.save();
    DB.post({action:'punch', driver:ST.driver, stopId:s.id, act:'離店',
      planTime:s.leave, storeId:(s.stores||[])[0]||'',
      lat:g?g.lat:'', lng:g?g.lng:''});
    // 離店時把該站所有已處理項目一併補送，確保不漏
    const h=host(day,s);
    (h.tasks||[]).forEach(t2=>{ if(t2.sched!==false && t2.st)
      DB.post({action:'task', driver:ST.driver, stopId:h.id, storeId:(h.stores||[])[0]||'',
        code:t2.code, name:t2.name, st:stName(t2.st), reason:t2.reason||''}); });

    <div class="body">

      ${locked?`<div class="warnbox"><b>尚未到店打卡</b><br>工作項目在到店打卡後才會解鎖。</div>`:
        `<div class="note"><b>到店 ${s.inAt}</b>（預定 ${s.arrive}）　${ji?ji.t:''}
        ${s.inGeo?`<br><span style="color:var(--ink3)">定位已記錄 · 精度 ±${s.inGeo.acc}m</span>`:''}
        ${s.outAt?`<br><b>離店 ${s.outAt}</b>（預定 ${s.leave}）`:''}</div>`}

      ${stores.length?`<div class="secttl">門市資訊</div>
        <div class="note" style="background:var(--soft);border-color:var(--line);color:var(--ink2)">
        ${stores.map(x=>`<div><b>${esc(x.id)} ${esc(x.name)}</b> · ${esc(x.city)}${esc(x.dist)} · ${esc(x.line)} · ${esc(x.grade)}級 · 區主管 ${esc(x.mgr)}</div>`).join('')}

      <div class="secttl">工作項目　${c.done}/${c.need}${c.na?`（不適用 ${c.na}）`:''}${c.off?`　·　本日未排程 ${c.off} 項`:''}</div>
      ${(!locked&&!closed)?`<button class="btn btn-ok" style="margin-bottom:11px" onclick="allDone()">✓ 本站全部完成</button>`:''}
      <div style="${locked?'opacity:.4;pointer-events:none':''}">${tasks||'<div class="note">此站無工作項目，僅需打卡。</div>'}</div>

      ${(!locked&&!closed)?`<div style="margin-top:16px"><button class="btn btn-out" onclick="clockOut()">離店打卡</button></div>`:''}

function modalOut(){
  return `<div class="mask" onclick="if(event.target===this)(ST.modal=null,render())"><div class="sheet">
    <h3>還有 ${ST.modal.n} 項未回報</h3>

function stName(st){ return st==='done'?'完成':st==='miss'?'未完成':st==='na'?'不適用':''; }

function setTask(ti,v){
  const day=ensureDay(ST.driver,ST.date), h=host(day,day.stops[ST.stop]);
  const t=h.tasks[ti];
  if(!t || t.sched===false) return;          // 本日未排程的項目不可操作
  t.st = (t.st===v? null : v); t.at = t.st? nowHM(): null;
  if(t.st==='done'){ t.reason=null; }
  DB.save();
  if(t.st) DB.post({action:'task', driver:ST.driver, stopId:h.id,
    storeId:(h.stores||[])[0]||'', code:t.code, name:t.name,
    st:stName(t.st), reason:t.reason||''});
  render();
}
function setReason(ti,v){
  const d=ensureDay(ST.driver,ST.date), h=host(d,d.stops[ST.stop]), t=h.tasks[ti];
  t.reason=v||null; DB.save();
  if(t.st) DB.post({action:'task', driver:ST.driver, stopId:h.id,
    storeId:(h.stores||[])[0]||'', code:t.code, name:t.name,
    st:stName(t.st), reason:t.reason||''});
}
function allDone(){
  const day=ensureDay(ST.driver,ST.date);
  const h=host(day,day.stops[ST.stop]);
  h.tasks.forEach(t=>{ if(t.sched!==false && !t.st){ t.st='done'; t.at=nowHM();
    DB.post({action:'task', driver:ST.driver, stopId:h.id, storeId:(h.stores||[])[0]||'',
      code:t.code, name:t.name, st:'完成', reason:''}); } });
  DB.save(); render();
}

/* 雲端當日資料快取。排程在本地生成（規則固定），打卡與勾選由雲端疊加 */
let CLOUD = {date:null, punches:[], tasks:[], exc:[], at:null, err:null, loading:false};

async function loadCloud(date){
  if(DB.mode!=='sheets'){ CLOUD={date:date,punches:[],tasks:[],exc:[],at:null,err:null,loading:false}; return; }
  CLOUD.loading=true; render();
  try{
    const r = await fetch(CFG.apiUrl+'?action=board&date='+encodeURIComponent(date));
    const j = await r.json();
    if(!j || j.ok===false) throw new Error((j&&j.error)||'讀取失敗');
    CLOUD = {date:date, punches:j.punches||[], tasks:j.tasks||[], exc:j.exc||[],
             at:new Date(), err:null, loading:false};
  }catch(e){
    CLOUD.loading=false; CLOUD.err=String(e&&e.message?e.message:e); CLOUD.date=date;
  }
  render();
}

/** 把雲端的打卡與項目狀態疊加到本地生成的當日排程上 */
function applyCloud(day){
  if(DB.mode!=='sheets' || CLOUD.date!==day.date) return day;
  const P = CLOUD.punches.filter(x=>String(x['司機ID'])===day.driver);
  const T = CLOUD.tasks  .filter(x=>String(x['司機ID'])===day.driver);
  const S2M = {'完成':'done','未完成':'miss','不適用':'na','未回報':null};
  (day.stops||[]).forEach(s=>{
    const pi = P.filter(x=>String(x['站點ID'])===s.id && String(x['動作'])==='到店')[0];
    const po = P.filter(x=>String(x['站點ID'])===s.id && String(x['動作'])==='離店')[0];
    if(pi){ s.inAt  = fmtHM(pi['伺服器時間']); }
    if(po){ s.outAt = fmtHM(po['伺服器時間']); }
    (s.tasks||[]).forEach(t=>{
      const rec = T.filter(x=>String(x['站點ID'])===s.id && String(x['項目代碼'])===t.code)[0];
      if(rec){ t.st = S2M[String(rec['狀態'])] || null; t.reason = rec['未完成原因']||null; }
    });
  });
  return day;
}
function fmtHM(v){
  if(v instanceof Date) return pad(v.getHours())+':'+pad(v.getMinutes());
  const m = String(v||'').match(/(\d{1,2}):(\d{2})/);
  return m ? pad(+m[1])+':'+m[2] : String(v||'');
}
function viewAdmin(){
  const tab=ST.tab||'board';
  if(DB.mode==='sheets' && !CLOUD.loading && CLOUD.date!==ST.date && !CLOUD.err){

  }
  return `<div class="app wide">
    <div class="bar"><button class="back" onclick="go('home')">‹</button>

      <td>${g}</td>
      <td style="min-width:110px">${c.den>0?`<b>${c.pct}%</b><div class="mini-tr"><div class="mini-tf" style="width:${c.pct}%"></div></div><span style="font-size:11px;color:var(--ink3)">${c.done}/${c.den}</span>`:'—'}</td>
      <td class="c">${c.stopIn}/${c.stopTot}</td>

    <div class="c"><div class="k">遲到次數</div><div class="v">${tot.late}</div><div class="d">容差 ±${CFG.toleranceMin} 分</div></div>
    <div class="c"><div class="k">未完成／未回報</div><div class="v">${tot.miss+tot.unrep}</div><div class="d">需追蹤</div></div>
  </div>
  <div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:11px">

      style="padding:8px 11px;border:1.5px solid var(--line);border-radius:8px">
    <span style="font-size:12.5px;color:var(--ink3)">星期${WD[dow]}</span>
    ${DB.mode==='sheets'
      ? `<button class="mini" style="padding:7px 13px" onclick="loadCloud('${date}')">${CLOUD.loading?'讀取中…':'重新載入雲端'}</button>
         <span style="font-size:12px;color:${CLOUD.err?'var(--bad)':'var(--ink3)'}">
         ${CLOUD.err?('雲端讀取失敗：'+esc(CLOUD.err))
           :(CLOUD.at&&CLOUD.date===date)?('雲端資料 '+pad(CLOUD.at.getHours())+':'+pad(CLOUD.at.getMinutes())+' 更新　打卡 '+CLOUD.punches.length+' 筆'):'尚未載入雲端資料，請按「重新載入雲端」'}</span>`
      : `<span style="font-size:12px;color:var(--warn)">本機示範模式 —— 只看得到這台裝置的資料。填入 CFG.apiUrl 後才會顯示全台司機。</span>`}
  </div>
  <div class="tw"><table>
    <thead><tr><th>司機</th><th>狀態</th><th>時間軸（灰＝預定 ／ 藍＝實際）</th><th>完成度</th><th class="c">到站</th><th class="c">遲到</th><th class="c">異常</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
  <div style="font-size:12px;color:var(--ink3);margin-top:10px">
    到站率與準時率並列顯示，不計入完成度分數（依定案口徑：完成度只算工作項目）。</div>`;

function ganttOf(day){
  const st=day.stops.filter(s=>s.type!=='TRAVEL');
  if(!st.length) return '—';
  const a=toMin(day.stops[0].arrive), b=toMin(day.stops[day.stops.length-1].leave), span=b-a||1;
  const bars=day.stops.map(s=>{
    const x=(toMin(s.arrive)-a)/span*100, w=Math.max((toMin(s.leave)-toMin(s.arrive))/span*100,1.2);
    return `<i class="p" style="left:${x}%;width:${w}%"></i>`;
  }).join('')+day.stops.filter(s=>s.inAt).map(s=>{
    const e=s.outAt||nowHM();
    const x=(toMin(s.inAt)-a)/span*100, w=Math.max((toMin(e)-toMin(s.inAt))/span*100,1.2);
    return `<i class="a" style="left:${Math.max(0,Math.min(100,x))}%;width:${Math.min(w,100)}%"></i>`;
  }).join('');
  return `<div class="gantt">${bars}</div>`;
}

function weekOf(dateStr){
  const [y,m,d]=dateStr.split('-').map(Number);
  const dt=new Date(y,m-1,d); const dow=dt.getDay()||7;
  dt.setDate(dt.getDate()-(dow-1));
  return [...Array(5)].map((_,i)=>{const x=new Date(dt);x.setDate(dt.getDate()+i);return todayStr(x);});
}
function tabDash(){
  const days=weekOf(ST.date);
  const rows=activeDrivers().map(d=>{
    const cs=days.map(dt=>calc(applyCloud(ensureDay(d.id,dt))));
    const den=cs.reduce((a,c)=>a+c.den,0), done=cs.reduce((a,c)=>a+c.done,0);

    const na=cs.reduce((a,c)=>a+c.na,0), need=cs.reduce((a,c)=>a+c.need,0);
    const naPct=need>0?Math.round(na/need*1000)/10:0;
    return {d,cs,pct,den,done,naPct,
      miss:cs.reduce((a,c)=>a+c.miss+c.unrep,0), late:cs.reduce((a,c)=>a+c.late,0)};
  }).sort((a,b)=>b.pct-a.pct);

  return `<div style="margin-bottom:11px;font-size:13px;color:var(--ink2)">

      <td style="min-width:120px"><b>${r.pct}%</b><div class="mini-tr"><div class="mini-tf" style="width:${r.pct}%;background:${r.pct>=90?'var(--ok)':r.pct>=70?'#d19a00':'var(--bad)'}"></div></div>
        <span style="font-size:11px;color:var(--ink3)">${r.done}/${r.den}</span></td>
      ${r.cs.map(c=>`<td class="c">${c.den>0?c.pct+'%':'—'}</td>`).join('')}
      <td class="c">${r.miss?`<span class="tag t-bad">${r.miss}</span>`:'0'}</td>
      <td class="c">${r.late||0}</td>
      <td class="c">${r.naPct>=CFG.naAlertPct?`<span class="tag t-warn">${r.naPct}%</span>`:r.naPct+'%'}</td>
    </tr>`).join('')}</tbody></table></div>
  <div style="font-size:12px;color:var(--ink3);margin-top:10px">
    不適用率連續兩週超過 ${CFG.naAlertPct}% 者自動列入異常清單。</div>`;
}

function tabReason(){
  const days=weekOf(ST.date), cnt={}, byDrv={};
  activeDrivers().forEach(d=>{
    days.forEach(dt=>{
      const day=applyCloud(ensureDay(d.id,dt));
      (day.stops||[]).forEach(s=>(s.tasks||[]).forEach(t=>{
        if(t.st==='miss'||t.st==='na'){
          const k=t.reason||'（未填原因）';
          cnt[k]=(cnt[k]||0)+1;
          byDrv[k]=byDrv[k]||{}; byDrv[k][d.name]=(byDrv[k][d.name]||0)+1;
        }
      }));
    });
  });
  const tot=Object.values(cnt).reduce((a,b)=>a+b,0);
  if(!tot) return `<div class="note">本週尚無未完成或不適用紀錄。<br>有資料後，這裡會顯示原因分布 —— 這張表才是真正能改善營運的東西：<b>R05 前站延誤連鎖</b>與 <b>R06 時間不足</b>佔比高，代表該調整的是排程，不是司機。</div>`;
  const rows=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(([k,v])=>{
    const r=REASON.find(x=>x.code===k);
    const pct=Math.round(v/tot*1000)/10;
    return `<tr><td><b>${esc(k)}</b> ${esc(r?r.name:'')}</td><td>${esc(r?r.cat:'—')}</td>
      <td class="c">${v}</td><td style="min-width:130px"><div class="mini-tr"><div class="mini-tf" style="width:${pct}%;background:${r&&r.cat==='排程因素'?'#d19a00':'var(--brand)'}"></div></div>${pct}%</td>
      <td style="font-size:11.5px;color:var(--ink3)">${Object.entries(byDrv[k]||{}).map(([n,c])=>n+' '+c).join('、')}</td></tr>`;
  }).join('');
  return `<div style="margin-bottom:11px;font-size:13px;color:var(--ink2)">本週 ${days[0]} ～ ${days[4]}　·　共 ${tot} 筆</div>
  <div class="tw"><table><thead><tr><th>原因</th><th>類別</th><th class="c">次數</th><th>佔比</th><th>分布</th></tr></thead>
  <tbody>${rows}</tbody></table></div>
  <div class="warnbox" style="margin-top:14px"><b>怎麼讀這張表：</b>橘色列（排程因素）佔比高，代表<b>排程本身太緊或不合理</b>，該修的是排程不是人。這是這套系統最有價值的產出。</div>`;
}

/* ── 匯出：Excel 2003 XML，多分頁、免外掛 ── */
function tabExport(){
  const days=weekOf(ST.date);
  return `<div class="note">匯出格式為 Excel 多分頁檔（.xls），可直接以 Excel／Google 試算表開啟並做樞紐分析。</div>
  <div class="kpi">
    <div class="c"><div class="k">本週區間</div><div class="v" style="font-size:16px">${days[0]}<br>～ ${days[4]}</div></div>
    <div class="c"><div class="k">分頁</div><div class="v" style="font-size:16px">6 個</div>
      <div class="d">週彙總／逐日明細／打卡明細／原因分析／異常清單／排程對照</div></div>
  </div>
  <button class="btn btn-go" style="margin-bottom:10px" onclick="exportWeek()">下載本週工作紀錄與完成度</button>
  <div style="font-size:12px;color:var(--ink3)">正式版可設定每週一 08:00 自動寄送至總部與倉儲部信箱。</div>`;
}
function xmlEsc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));}
function sheetXml(name,rows){
  return `<Worksheet ss:Name="${xmlEsc(name).slice(0,31)}"><Table>`+
    rows.map(r=>'<Row>'+r.map(c=>{
      const num = typeof c==='number';
      return `<Cell><Data ss:Type="${num?'Number':'String'}">${xmlEsc(c)}</Data></Cell>`;
    }).join('')+'</Row>').join('')+`</Table></Worksheet>`;
}
function exportWeek(){
  const days=weekOf(ST.date), drs=activeDrivers();
  const S1=[['年週','司機','員編','區域','路線','週完成度%','應做','已完成','不適用','不適用率%','未完成','未回報','到站率%','準時率%','遲到','區主管檢核','檢核意見']];
  const S2=[['日期','星期','司機','區域','站點','門市代碼','門市名稱','到訪序','作業型態','工作項目','狀態','完成時間','未完成原因']];
  const S3=[['日期','司機','站點','動作','預定時間','實際時間','誤差分鐘','判定','緯度','經度','定位精度m']];
  const S4=[['原因代碼','原因','類別','次數','佔比%']];
  const S5=[['日期','司機','類型','站點','說明','狀態']];
  const S6=[['路線','區域','司機','適用星期','序','站點','類型','作業型態','到訪序','預定到店','預定離店','說明']];
  const rc={};

  drs.forEach(d=>{
    let W={need:0,done:0,na:0,miss:0,unrep:0,stopTot:0,stopIn:0,punct:0,punchTot:0,late:0};
    days.forEach(dt=>{
      const day=ensureDay(d.id,dt), c=calc(day);
      ['need','done','na','miss','unrep','stopTot','stopIn','punct','punchTot','late'].forEach(k=>W[k]+=c[k]);
      (day.stops||[]).forEach(s=>{
        const nm=(s.stores||[]).map(i=>(STORE[i]||{}).name||i).join('／');
        (host(day,s).tasks||[]).filter(()=>!s.shareFrom).forEach(t=>{
          const r=REASON.find(x=>x.code===t.reason);
          S2.push([dt,'週'+WD[dowOf(dt)],d.name,d.region,s.label,(s.stores||[]).join('／'),nm,
            s.visit||'', s.mode||'', t.name,
            t.sched===false?'本日未排程':
            t.st==='done'?'完成':t.st==='miss'?'未完成':t.st==='na'?'不適用':(s.outAt?'未回報':'未處理'),
            t.at||'', t.reason||'']);
          if(t.st==='miss'||t.st==='na'){const k=t.reason||'（未填）';rc[k]=(rc[k]||0)+1;}
        });
        [['到店',s.arrive,s.inAt,s.inGeo],['離店',s.leave,s.outAt,s.outGeo]].forEach(([act,pl,ac,g])=>{
          if(!ac) return;
          const j=judge(ac,pl);
          S3.push([dt,d.name,s.label,act,pl,ac,j.d,j.k==='ok'?'準時':(j.d>0?'遲/滯留':'早退'),
            g?g.lat:'',g?g.lng:'',g?g.acc:'']);
        });
        if(!s.inAt && s.type!=='TRAVEL' && s.type!=='REST')
          S5.push([dt,d.name,'未打卡',s.label,'預定 '+s.arrive+'–'+s.leave,'待處理']);
      });
    });
    const den=W.need-W.na;
    S1.push(['W'+isoWeek(days[0]),d.name,d.emp,d.region,RTE[d.route].name,
      den>0?Math.round(W.done/den*1000)/10:0, den, W.done, W.na,
      W.need>0?Math.round(W.na/W.need*1000)/10:0, W.miss, W.unrep,
      W.stopTot>0?Math.round(W.stopIn/W.stopTot*1000)/10:0,
      W.punchTot>0?Math.round(W.punct/W.punchTot*1000)/10:0, W.late, '', '']);
  });

  const tot=Object.values(rc).reduce((a,b)=>a+b,0)||1;
  Object.entries(rc).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>{
    const r=REASON.find(x=>x.code===k);
    S4.push([k,r?r.name:'（未填原因）',r?r.cat:'',v,Math.round(v/tot*1000)/10]);
  });
  M.stations.forEach(s=>{const rt=RTE[s.route];
    S6.push([rt.name,rt.region,(DRV[rt.driver]||{}).name||'',s.days,s.seq,s.label,s.type,s.mode||'',s.visit||'',s.arrive,s.leave,s.note||'']);
  });

  const xml=`<?xml version="1.0"?><?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
${sheetXml('①週彙總',S1)}${sheetXml('②逐日明細',S2)}${sheetXml('③打卡明細',S3)}
${sheetXml('④原因分析',S4)}${sheetXml('⑤異常清單',S5)}${sheetXml('⑥排程對照',S6)}
</Workbook>`;
  const blob=new Blob(['﻿'+xml],{type:'application/vnd.ms-excel;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`倉儲物流週報_${days[0]}_${days[4]}.xls`;
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function isoWeek(ds){
  const [y,m,d]=ds.split('-').map(Number); const dt=new Date(Date.UTC(y,m-1,d));
  const dn=dt.getUTCDay()||7; dt.setUTCDate(dt.getUTCDate()+4-dn);
  const ys=new Date(Date.UTC(dt.getUTCFullYear(),0,1));
  return Math.ceil(((dt-ys)/86400000+1)/7);
}

/* ══════════════════════════════════════════════════════════
   排程與人員 — 異動入口
   實際編輯在 Google 試算表（單一資料來源），此處提供檢視與導引
   ══════════════════════════════════════════════════════════ */
function tabMaster(){
  const open = CFG.sheetUrl
    ? `<a class="btn btn-go" style="text-decoration:none" href="${CFG.sheetUrl}" target="_blank">開啟 Google 試算表</a>`
    : `<button class="btn" disabled>尚未設定試算表網址</button>
       <div style="font-size:12px;color:var(--ink3);margin-top:6px">
       在 HTML 的 <code>CFG.sheetUrl</code> 填入試算表網址後，這裡就會變成一鍵開啟。</div>`;

  const drv = M.drivers.map(d=>{
    const D2=DRV[d[0]], rt=RTE[D2.route]||{};
    const cnt = M.stations.filter(x=>x.route===D2.route).length;
    return `<tr>
      <td><b>${esc(D2.name)}</b></td><td>${esc(D2.emp||'—')}</td><td>${esc(D2.region)}</td>
      <td>${D2.route?`<code>${esc(D2.route)}</code><br><span style="font-size:11px;color:var(--ink3)">${esc(rt.name||'')}</span>`:'<span class="tag t-mute">未指派</span>'}</td>
      <td class="c">${D2.on}–${D2.off}</td>
      <td class="c">${esc(D2.ab||'—')}</td>
      <td class="c">${D2.status==='在職'?'<span class="tag t-ok">在職</span>':'<span class="tag t-warn">'+esc(D2.status)+'</span>'}</td>
      <td class="c">${cnt||'<span class="tag t-mute">0</span>'}</td></tr>`;
  }).join('');

  const rte = M.routes.map(r=>{
    const R2=RTE[r[0]], d=DRV[R2.driver]||null;
    const days=[...R2.days].map(x=>'一二三四五'[+x-1]).join('');
    const cnt=M.stations.filter(x=>x.route===R2.id).length;
    return `<tr>
      <td><code>${esc(R2.id)}</code></td><td>${esc(R2.region)}</td>
      <td>${esc(R2.name)}</td><td>${esc((d&&d.status==='在職')?d.name:'（待分配）')}</td>
      <td class="c">週${days}</td><td class="c">${cnt}</td>
      <td class="c">${R2.status==='上線'?'<span class="tag t-ok">上線</span>'
        :R2.status==='待分配'?'<span class="tag t-info">待分配</span>'
        :'<span class="tag t-warn">建置中</span>'}</td></tr>`;
  }).join('');

  return `
  <div class="note"><b>所有主檔異動都在 Google 試算表進行，這裡是檢視與導引。</b><br>
    這樣設計的原因：試算表是唯一的資料來源，只有一個地方可以改，就不會出現「App 改了但試算表沒改」的分歧。
    ${DB.mode==='local'?'<br><br><b style="color:var(--bad)">目前為本機示範模式</b>，尚未連上試算表。接上後端後這裡的一鍵開啟才會生效。':''}</div>

  ${open}

  <div class="secttl" style="margin-top:22px">三種異動情境</div>
  <div class="tw"><table>
    <thead><tr><th style="width:16%">情境</th><th style="width:20%">改哪裡</th><th style="width:34%">怎麼做</th><th class="c" style="width:10%">耗時</th><th>要不要改排程</th></tr></thead>
    <tbody>
      <tr><td><b>司機換人</b><br><span style="font-size:11px;color:var(--ink3)">到職／離職／代班</span></td>
        <td><code>M1_司機</code></td>
        <td>選單 <b>AIR SPACE 物流 → 人員異動精靈</b>，依提示填即可。<br>
            或直接改 <code>M1_司機</code> 的「路線代碼」欄 → 選單「清除主檔快取」</td>
        <td class="c"><b>30 秒</b></td>
        <td><span class="tag t-ok">完全不用</span> 路線與司機解耦</td></tr>

      <tr><td><b>改時間或門市</b><br><span style="font-size:11px;color:var(--ink3)">一兩個站點微調</span></td>
        <td><code>M4_站點</code></td>
        <td>直接改儲存格 → 選單 <b>② 驗證並套用排程</b></td>
        <td class="c"><b>1 分鐘</b></td>
        <td>只改那幾格</td></tr>

      <tr><td><b>整條路線換版</b><br><span style="font-size:11px;color:var(--ink3)">新增路線／季度調整</span></td>
        <td><code>M4_站點</code><br><code>M3_路線</code></td>
        <td>新增站點列（照現有格式）→ <code>M3_路線</code> 狀態改「上線」→ 選單 <b>② 驗證並套用排程</b></td>
        <td class="c"><b>10 分鐘</b></td>
        <td>驗證器會逐格檢查</td></tr>
    </tbody>
  </table></div>

  <div class="warnbox"><b>改完一定要按「② 驗證並套用排程」或「清除主檔快取」。</b>
    系統為了效能會把主檔快取 5 分鐘，不清快取的話最多要等 5 分鐘才生效。</div>

  <div class="secttl">目前人員配置　${M.drivers.filter(d=>d[8]==='在職').length} 位在職 ／ 共 ${M.drivers.length} 筆</div>
  <div class="tw"><table>
    <thead><tr><th>姓名</th><th>員編</th><th>區域</th><th>路線代碼</th><th class="c">工時</th><th class="c">A/B表</th><th class="c">狀態</th><th class="c">站點數</th></tr></thead>
    <tbody>${drv}</tbody></table></div>

  <div class="secttl">目前路線配置　${M.routes.filter(r=>r[5]==='上線').length} 條上線 ／ ${M.routes.filter(r=>r[5]==='待分配').length} 條待分配 ／ ${M.routes.filter(r=>r[5]==='建置中').length} 條建置中</div>
  <div class="tw"><table>
    <thead><tr><th>路線代碼</th><th>區域</th><th>路線名稱</th><th>司機</th><th class="c">適用星期</th><th class="c">站點數</th><th class="c">狀態</th></tr></thead>
    <tbody>${rte}</tbody></table></div>

  <div class="note" style="margin-top:18px"><b>為什麼「路線 3」「北桃 2」可以先空著</b><br>
    排程掛在<b>路線代碼</b>上，不是掛在人身上。招募到人只要把名字填進 <code>M1_司機</code> 並指定路線代碼，
    排程一個字都不用動。站點還沒補的路線會顯示「排程建置中」，不會產生未到站紅燈，也不列入完成度統計。</div>`;
}

/* ── 看板自動更新 ── */
setInterval(()=>{
  if(ST.view==='admin' && ST.tab==='board'){
    if(DB.mode==='sheets') loadCloud(ST.date); else render();
  }
}, 30000);

/* ── 啟動 ── */
DB.load(); render();
</script>
